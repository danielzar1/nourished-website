<!DOCTYPE html>
<html lang="en" data-year="2026">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build a Box — Nourished | Mix Your Own Sweets</title>
  <meta name="description" content="Build your own box of Nourished sweets — mix any 6, 12 or 18 bags of your favourite no-added-sugar flavours and we'll deliver them to your door.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-slot"></div>
  <main id="main">
    <section class="section--tight">
      <div class="container center stack">
        <span class="eyebrow">🎁 Pick &amp; Mix</span>
        <h1 class="section-title">Build your own box</h1>
        <p class="lead" style="margin-inline:auto">Pick your box size, mix your favourite flavours, and watch the fun fill up. More flavours, more FUNDAY.</p>
        <img id="bab-hero" src="" alt="A FUNDAY box overflowing with colourful sweets" style="width:100%;max-width:460px;margin:1.6rem auto 0;border-radius:var(--r-lg);box-shadow:var(--shadow-md)">
      </div>
    </section>

    <section style="padding-bottom:clamp(48px,8vw,96px)">
      <div class="container">
        <div id="bab" class="bab-grid">

          <!-- STAGE: the box -->
          <div class="bab-stage">
            <div class="bab-box" id="bab-box">
              <div class="bab-meter">
                <svg class="bab-ring" viewBox="0 0 100 100" aria-hidden="true">
                  <circle class="track" cx="50" cy="50" r="45"/>
                  <circle class="fill" id="bab-ring-fill" cx="50" cy="50" r="45"/>
                </svg>
                <div>
                  <div class="bab-counter" id="bab-counter">0 / 12</div>
                  <div class="muted" style="font-size:.85rem">bags in your box</div>
                </div>
                <div style="margin-left:auto;text-align:right">
                  <div class="card__price" id="bab-price" style="font-size:1.6rem">R900</div>
                  <div class="muted" style="font-size:.78rem">R75 / bag</div>
                </div>
              </div>
              <div class="bab-slots" id="bab-slots"></div>
            </div>

            <label class="toggle-card" data-active="false" style="margin-top:1rem">
              <input type="checkbox" id="bab-sub">
              <span><span class="toggle-card__title">↻ Subscribe &amp; Save <span class="save-flag">10%</span></span><br>
              <span class="muted">Get this box monthly and save 10%. Skip or cancel anytime.</span></span>
            </label>

            <button class="btn btn--lg btn--block" id="bab-add" style="margin-top:1rem" disabled>Pick 12 more</button>
          </div>

          <!-- CONTROLS: size + flavours -->
          <div class="stack" style="--stack-gap:1.5rem">
            <div>
              <h2 style="font-size:1.3rem;margin-bottom:.8rem">1. Choose your box size</h2>
              <div class="size-pills">
                <button class="size-pill" data-size="6">6 bags<small>R450</small></button>
                <button class="size-pill" data-size="12">12 bags<small>R900 · popular</small></button>
                <button class="size-pill" data-size="18">18 bags<small>R1350</small></button>
              </div>
            </div>
            <div style="margin-top:1.5rem">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.8rem;flex-wrap:wrap">
                <h2 style="font-size:1.3rem">2. Mix your flavours</h2>
                <button class="btn btn--ghost" id="bab-surprise">🎲 Surprise me</button>
              </div>
              <div class="bab-flavours" id="bab-flavours"></div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/confetti.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/buildbox.js"></script>
</body>
</html>
