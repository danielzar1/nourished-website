<!DOCTYPE html>
<html lang="en" data-year="2026">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag — Nourished</title>
  <meta name="description" content="Review your Nourished order.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-slot"></div>
  <main id="main">
    <section class="section--tight">
      <div class="container">
        <h1 class="section-title" style="margin-bottom:1.5rem">Your bag</h1>
        <div class="split" style="align-items:start;grid-template-columns:1fr">
          <div class="panel" style="padding:1rem var(--gutter)">
            <div id="cart-page-items"></div>
          </div>
          <div class="panel" id="cart-summary">
            <h2 style="font-size:1.3rem;margin-bottom:1rem">Order summary</h2>
            <div class="ship-bar" style="background:var(--cream-deep);border-radius:var(--r-md);margin-bottom:1.2rem">
              <div class="ship-bar__msg" data-ship-msg></div>
              <div class="ship-bar__track"><div class="ship-bar__fill" data-ship-fill></div></div>
            </div>
            <div class="cart-row" data-saved-row style="display:none;color:var(--leaf)"><span>Subscription savings</span><span data-sum-saved>R0</span></div>
            <div class="cart-row"><span>Subtotal</span><span data-sum-subtotal>R0</span></div>
            <div class="cart-row"><span>Delivery</span><span data-sum-shipping>R0</span></div>
            <div class="cart-row cart-row--total"><span>Total</span><span data-sum-total>R0</span></div>
            <button class="btn btn--lg btn--block" id="cart-page-checkout">Checkout</button>
            <a class="btn btn--ghost btn--block" href="shop.html" style="margin-top:.6rem">Continue shopping</a>
            <p class="muted center" style="font-size:.78rem;margin-top:.6rem">Prototype — checkout is for demo only.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/confetti.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Cart.render();
      document.getElementById('cart-page-checkout').addEventListener('click', () => {
        if (Cart.totals().empty) return;
        FX.celebrate();
        alert('Thanks! This is a prototype — in the live store this goes to secure Shopify checkout.');
      });
    });
  </script>
  <style>@media(min-width:900px){#main .split{grid-template-columns:1.6fr 1fr!important}#cart-summary{position:sticky;top:calc(var(--header-h) + 16px)}}</style>
</body>
</html>
